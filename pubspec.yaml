name: utslab
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/quiz_logo.png
    - lib/assets/images/icon22.png
    - lib/assets/images/icon33.png
    - lib/assets/images/icon44.png
    - lib/assets/images/icon55.png
    
  fonts:
    - family: Montserrat
      fonts:
        - asset: lib/assets/font/Montserrat-Regular.ttf
        - asset: lib/assets/font/Montserrat-Medium.ttf
          weight: 500
        - asset: lib/assets/font/Montserrat-Bold.ttf
          weight: 700
